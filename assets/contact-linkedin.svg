<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 133 40" width="133" height="40" role="img" aria-labelledby="title">
<title id="title">LinkedIn</title>
<style>
.in{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.65,0,.35,1) both}
.ping{opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(.16,1,.3,1) infinite}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow .9s cubic-bezier(.16,1,.3,1) both}
.nudge{animation:nudge 3.2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.2);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes nudge{0%,62%,100%{transform:none}76%{transform:translate(3px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
